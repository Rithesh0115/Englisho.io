<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./global1.css" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fugaz One:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Basic:ital,wght@1,800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row min-vh-100 align-items-center">
        <div class="col-lg-6 mb-4 mb-lg-0">
          <div class="text-center">
            <img class="img-fluid mb-4" style="max-width: 180px;" src="ellipse-1@2x.png" alt="" />
            <div class="position-relative">
              <img class="img-fluid" style="max-height: 504px;" src="kids@2x.png" alt="" />
            </div>
          </div>
        </div>
        
        <div class="col-lg-6">
          <section class="text-center px-3">
            <h1 class="learn-meanings-of display-4 mb-4" data-animate-on-scroll>
              Learn meanings of word and pronunciation for free!
            </h1>
            <div class="d-grid gap-3 justify-content-center">
              <button class="btn btn-gradient btn-lg primary-button">
                <i class="get-started">Get Started !</i>
              </button>
              <a href="index1.html" class="text-decoration-none">
                <button class="btn btn-dark btn-lg">
                  <span class="button1">Skip</span>
                </button>
              </a>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      var scrollAnimElements = document.querySelectorAll("[data-animate-on-scroll]");
      var observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting || entry.intersectionRatio > 0) {
              const targetElement = entry.target;
              targetElement.classList.add("animate");
              observer.unobserve(targetElement);
            }
          }
        },
        {
          threshold: 0.15,
        }
      );
      
      for (let i = 0; i < scrollAnimElements.length; i++) {
        observer.observe(scrollAnimElements[i]);
      }


      document.querySelector('.primary-button').addEventListener('click', function() {
    window.location.href = './index2.html';
  });


      
      </script>
  </body>
</html>
