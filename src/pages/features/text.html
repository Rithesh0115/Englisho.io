<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Studio - EnglishO</title>
    <link rel="stylesheet" href="~/src/styles/global.css">
    <style>
        .workspace-grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: var(--space-lg);
            margin-top: var(--space-xl);
            height: calc(100vh - 200px);
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            background: var(--clr-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--clr-border);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .editor-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--clr-border);
            background: var(--clr-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mock-controls select {
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--clr-border);
            background: white;
            font-size: 0.9rem;
        }

        .workspace-textarea {
            flex: 1;
            width: 100%;
            padding: 2rem;
            border: none;
            resize: none;
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--clr-text);
            outline: none;
        }

        .workspace-textarea::placeholder {
            color: var(--clr-text-muted);
            opacity: 0.5;
        }

        .editor-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--clr-border);
            background: var(--clr-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Simulated Soundwave */
        .soundwave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 30px;
            opacity: 0.3;
        }

        .soundwave.active {
            opacity: 1;
        }

        .soundwave.active .bar {
            animation: bounce 1s infinite alternate;
        }

        .bar {
            width: 4px;
            background: var(--clr-primary);
            border-radius: 2px;
            height: 10px;
            transition: height 0.2s;
        }

        @keyframes bounce {
            0% { height: 10px; }
            100% { height: 30px; }
        }

        .side-panel {
            background: var(--clr-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--clr-border);
            padding: var(--space-md);
        }

        @media (max-width: 900px) {
            .workspace-grid { grid-template-columns: 1fr; height: auto; }
            .workspace-textarea { min-height: 300px; }
        }
    </style>
</head>
<body class="flex-col min-h-screen">

    <div class="mesh-bg"></div>

    <englisho-navbar></englisho-navbar>

    <main class="container flex-1 animate-fade-up">
        
        <div class="workspace-grid">
            <!-- Main Editor -->
            <div class="editor-card">
                <div class="editor-header">
                    <div style="font-weight: 600; color: var(--clr-text-muted);">Text Input</div>
                    <div class="mock-controls flex gap-sm">
                        <select>
                            <option>Neural Voice (English US)</option>
                            <option>Neural Voice (English UK)</option>
                        </select>
                        <select>
                            <option>1.0x Speed</option>
                            <option>0.75x Speed</option>
                        </select>
                    </div>
                </div>
                
                <textarea placeholder="Type something here to synthesize..." class="workspace-textarea"></textarea>
                
                <div class="editor-footer">
                    <div class="soundwave" id="visualizer">
                        <!-- Bars injected by JS -->
                        <div class="bar" style="animation-delay: 0.1s"></div>
                        <div class="bar" style="animation-delay: 0.4s"></div>
                        <div class="bar" style="animation-delay: 0.2s"></div>
                        <div class="bar" style="animation-delay: 0.5s"></div>
                        <div class="bar" style="animation-delay: 0.3s"></div>
                        <div class="bar" style="animation-delay: 0.6s"></div>
                        <div class="bar" style="animation-delay: 0.2s"></div>
                        <div class="bar" style="animation-delay: 0.5s"></div>
                        <div class="bar" style="animation-delay: 0.1s"></div>
                    </div>
                    
                    <button class="btn btn-primary" id="playBtn" style="border-radius: var(--radius-full); padding: 0.75rem 2rem;">
                        ▶ Synthesize
                    </button>
                </div>
            </div>

            <!-- Side Panel -->
            <div class="side-panel">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--clr-text-muted);">Generation History</h3>
                <div class="flex-col gap-sm">
                    <div style="padding: 0.75rem; background: var(--clr-bg); border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--clr-text-muted); cursor: not-allowed;">
                        No history yet. Start typing!
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="~/src/scripts/pages/text.js" defer></script>
    <script>
        // Mock visualizer animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('.btn-primary');
            // The original logic hooks into <button> inside text.html without an ID.
            // The text.js probably does querySelector('button'). We will intercept it or just add the class.
            
            btn.addEventListener('click', () => {
                const vis = document.getElementById('visualizer');
                vis.classList.add('active');
                
                // Stop after 3 seconds for mock effect if speech synthesis is fast
                setTimeout(() => {
                    vis.classList.remove('active');
                }, 3000);
            });
        });
    </script>
<script type="module" src="~/src/scripts/components/Navbar.js"></script>
    <script type="module" src="~/src/scripts/components/Footer.js"></script>
</body>
</html>
