<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - EnglishO</title>
    <link rel="stylesheet" href="~/src/styles/global.css" />
</head>
<body class="flex-col min-h-screen">
    <div class="mesh-bg"></div>
    
    <englisho-navbar></englisho-navbar>

    <main class="container flex-1 flex justify-center items-center animate-fade-up py-xl">
        <div class="card p-xl w-full" style="max-width: 450px; text-align: center;">
            
            <div class="flex-col items-center mb-xl">
                <a href="~/src/index.html" class="nav-brand mb-md flex justify-center" style="width: 100%;">
                    <div style="width: 32px; height: 32px; background: var(--clr-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white;">E</div>
                    <span>EnglishO</span>
                </a>
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem; letter-spacing: -0.03em;">Create Account</h2>
                <p class="text-muted">Join us and start learning English today.</p>
            </div>

            <form id="authForm" class="flex-col gap-md text-left w-full">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input class="input-field" type="text" placeholder="Enter your full name" required />
                </div>

                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <input class="input-field" type="email" placeholder="Enter your email" required />
                </div>
                
                <div class="input-group">
                    <label class="input-label" style="margin-bottom: 0.25rem;">Password</label>
                    <input class="input-field" type="password" placeholder="Create a password" required />
                </div>

                <div class="w-full mt-sm">
                    <button type="submit" class="btn btn-primary w-full" style="border-radius: var(--radius-full); padding: 1rem;">Sign Up</button>
                </div>
            </form>

            <div style="display: flex; align-items: center; text-align: center; margin: 2rem 0;">
                <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--clr-border);">
                <span class="text-muted" style="padding: 0 1rem; font-size: 0.9rem;">or sign up with</span>
                <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--clr-border);">
            </div>

            <div class="flex justify-center mb-xl">
                <button class="btn btn-outline" style="border-radius: 50%; width: 50px; height: 50px; padding: 0;">
                    <img src="~/src/assets/icons/gmail.svg" alt="Google" style="width: 20px;" onerror="this.src='~/src/assets/images/gmail-logo.png'">
                </button>
            </div>

            <div class="text-center">
                <p class="text-muted">Already have an account? <a href="~/src/pages/auth/sign-in.html" class="text-primary font-600" style="text-decoration: none;">Log in</a></p>
                <div class="mt-md">
                    <a href="~/src/pages/core/dictionary.html" class="text-muted text-sm" style="text-decoration: underline;">Skip for now</a>
                </div>
            </div>

        </div>
    </main>

    <englisho-footer></englisho-footer>

    <script type="module" src="~/src/scripts/components/Navbar.js"></script>
    <script type="module" src="~/src/scripts/components/Footer.js"></script>
    <script type="module">
        import { SessionManager } from '~/src/scripts/services/SessionManager.js';
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const name = inputs[0].value.trim();
            const email = inputs[1].value.trim();
            // Fix #8: Save with role, then redirect to greeting page first
            SessionManager.loginUser({ name, role: 'Parent', email });
            window.location.href = '../features/greeting.html';
        });
    </script>
</body>
</html>
